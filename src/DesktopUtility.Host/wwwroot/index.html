<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DesktopUtility">
    <meta name="theme-color" content="#050506">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Use your iPad as a second monitor or trackpad for your Windows PC.">

    <title>DesktopUtility</title>

    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <!-- Shared SVG symbols -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-logo" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="17" height="12" rx="2"/>
            <path d="M7 20h7M10.5 16v4"/>
            <rect x="15.5" y="10" width="9" height="13" rx="2" fill="rgba(255,255,255,0.12)"/>
            <path d="M19 20.5h2"/>
        </symbol>
        <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
        </symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4v6h-6M3 20v-6h6"/><path d="M3.5 9a9 9 0 0114.9-3.4L21 10M3 14l2.6 4.4A9 9 0 0020.5 15"/>
        </symbol>
        <symbol id="i-qr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
            <path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/>
        </symbol>
        <symbol id="i-keyboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 16h6"/>
        </symbol>
        <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M18 6L6 18M6 6l12 12"/>
        </symbol>
        <symbol id="i-power" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18.4 6.6a9 9 0 11-12.8 0M12 3v9"/>
        </symbol>
        <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/>
        </symbol>
    </svg>

    <!-- Ambient light: gradient + noise + grid + floating blobs -->
    <div class="ambient" aria-hidden="true">
        <div class="ambient-grid"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="ambient-noise"></div>
    </div>

    <main id="app">

        <!-- ───────────── Onboarding ───────────── -->
        <section id="screen-onboarding" class="screen hidden">
            <div class="stack">
                <div class="center-stack center" style="max-width: 920px">
                    <span class="logo reveal" style="--i:0"><svg><use href="#i-logo"/></svg></span>
                    <h1 class="h1 text-gradient reveal" style="--i:1" data-i18n="onb.title"></h1>
                    <p class="lead reveal" style="--i:2" data-i18n="onb.lead"></p>

                    <div class="steps" style="width:100%; text-align:left">
                        <div class="card step reveal" style="--i:3"><span class="step-num">01</span><p class="step-text" data-i18n-html="onb.step1"></p></div>
                        <div class="card step reveal" style="--i:4"><span class="step-num">02</span><p class="step-text" data-i18n-html="onb.step2"></p></div>
                        <div class="card step reveal" style="--i:5"><span class="step-num">03</span><p class="step-text" data-i18n-html="onb.step3"></p></div>
                    </div>

                    <button id="btn-skip-onboarding" class="btn btn-secondary btn-large reveal" style="--i:6" data-i18n="onb.continue"></button>
                </div>
            </div>
        </section>

        <!-- ───────────── Connection ───────────── -->
        <section id="screen-connection" class="screen">
            <div class="stack">
                <div class="bento">
                    <header class="hero reveal" style="--i:0">
                        <div class="brand">
                            <span class="logo"><svg><use href="#i-logo"/></svg></span>
                            <span class="label" data-i18n="conn.eyebrow"></span>
                        </div>
                        <h1 class="display">
                            <span class="text-gradient" data-i18n="conn.title.a"></span><br>
                            <span class="text-accent" data-i18n="conn.title.b"></span>
                        </h1>
                        <p class="lead" data-i18n="conn.lead"></p>
                    </header>

                    <section class="card card-hosts reveal" style="--i:1">
                        <div class="section-head">
                            <span class="label" data-i18n="conn.available"></span>
                            <button id="btn-refresh-hosts" class="icon-btn" data-i18n-aria="conn.refresh"><svg width="18" height="18"><use href="#i-refresh"/></svg></button>
                        </div>
                        <div id="hosts-list" class="hosts-list">
                            <div class="host-placeholder"><div class="spinner spinner-small"></div><span data-i18n="conn.searching"></span></div>
                        </div>
                    </section>

                    <section class="card card-actions reveal" style="--i:2">
                        <div class="actions">
                            <button id="btn-scan-qr" class="btn btn-primary btn-large btn-block">
                                <svg width="20" height="20"><use href="#i-qr"/></svg><span data-i18n="conn.scan"></span>
                            </button>
                            <button id="btn-manual-connect" class="btn btn-secondary btn-block" data-i18n="conn.enterip"></button>
                        </div>
                        <div id="manual-connect-panel" class="manual hidden">
                            <div class="input-row">
                                <input id="input-ip" class="input" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-placeholder="conn.ip.placeholder">
                                <input id="input-port" class="input input-port" type="text" inputmode="numeric" value="9876" aria-label="Port">
                            </div>
                            <button id="btn-connect-ip" class="btn btn-primary btn-block" data-i18n="conn.connect"></button>
                        </div>
                    </section>

                    <section id="tip-card" class="card card-tip reveal" style="--i:3">
                        <div class="tip">
                            <svg width="20" height="20" style="flex:none; color:#a5acff"><use href="#i-share"/></svg>
                            <p data-i18n-html="conn.tip"></p>
                        </div>
                    </section>
                </div>
            </div>
        </section>

        <!-- ───────────── PIN ───────────── -->
        <section id="screen-pin" class="screen hidden">
            <div class="stack">
                <div class="center-stack narrow center">
                    <span class="logo reveal" style="--i:0"><svg><use href="#i-logo"/></svg></span>
                    <h1 class="h1 text-gradient reveal" style="--i:1" data-i18n="pin.title"></h1>
                    <p class="lead reveal" style="--i:2" data-i18n="pin.lead"></p>
                    <div class="card reveal" style="--i:3; width:100%">
                        <input id="input-pin" class="input pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
                        <p id="pin-error" class="error-text" style="margin-top:12px" role="alert"></p>
                        <button id="btn-submit-pin" class="btn btn-primary btn-large btn-block" style="margin-top:6px" data-i18n="pin.pair"></button>
                    </div>
                    <button id="btn-cancel-pin" class="btn btn-ghost reveal" style="--i:4" data-i18n="btn.cancel"></button>
                </div>
            </div>
        </section>

        <!-- ───────────── QR scanner ───────────── -->
        <section id="screen-qr-scanner" class="screen hidden">
            <div class="stack">
                <div class="center-stack center">
                    <div class="qr-wrap reveal" style="--i:0">
                        <video id="qr-video" autoplay playsinline muted></video>
                        <div class="qr-frame"></div>
                    </div>
                    <canvas id="qr-canvas" class="hidden"></canvas>
                    <p class="lead reveal" style="--i:1" data-i18n="qr.hint"></p>
                    <button id="btn-close-qr" class="btn btn-secondary reveal" style="--i:2" data-i18n="btn.cancel"></button>
                </div>
            </div>
        </section>

        <!-- ───────────── Connecting ───────────── -->
        <section id="screen-connecting" class="screen hidden">
            <div class="stack">
                <div class="center-stack narrow center">
                    <div class="spinner reveal" style="--i:0"></div>
                    <h2 id="connecting-title" class="h3 reveal" style="--i:1"></h2>
                    <p id="connecting-status" class="muted reveal" style="--i:2"></p>
                    <button id="btn-cancel-connect" class="btn btn-ghost reveal" style="--i:3" data-i18n="btn.cancel"></button>
                </div>
            </div>
        </section>

        <!-- ───────────── Session ───────────── -->
        <section id="screen-session" class="screen hidden">
            <video id="remote-video" autoplay playsinline muted></video>
            <div id="touch-overlay" class="touch-overlay"></div>

            <div id="mode-badge" class="mode-badge glass">
                <svg id="mode-badge-icon" width="16" height="16"><use href="#i-monitor"/></svg>
                <span id="mode-badge-text"></span>
            </div>

            <button id="bar-handle" class="bar-handle" data-i18n-aria="bar.mode"></button>

            <div id="control-bar" class="control-bar glass">
                <div class="bar-label">
                    <span class="label" data-i18n="bar.mode"></span>
                    <span class="latency"><span id="latency-dot" class="dot"></span><span id="latency-value">-- ms</span></span>
                </div>
                <div class="segmented" role="tablist">
                    <button id="seg-extended" class="seg active" data-mode="extended" data-i18n="mode.extended"></button>
                    <button id="seg-remote" class="seg" data-mode="remote" data-i18n="mode.remote"></button>
                </div>

                <div class="bar-label"><span class="label" data-i18n="bar.quality"></span></div>
                <div class="segmented">
                    <button class="seg" data-quality="low" data-i18n="quality.low"></button>
                    <button class="seg active" data-quality="medium" data-i18n="quality.medium"></button>
                    <button class="seg" data-quality="high" data-i18n="quality.high"></button>
                </div>

                <div class="bar-row">
                    <button id="btn-keyboard" class="btn btn-secondary grow"><svg width="20" height="20"><use href="#i-keyboard"/></svg><span data-i18n="bar.keyboard"></span></button>
                    <button id="btn-disconnect" class="btn btn-danger grow"><svg width="20" height="20"><use href="#i-power"/></svg><span data-i18n="bar.disconnect"></span></button>
                </div>
            </div>

            <div id="reconnect-overlay" class="overlay-msg hidden">
                <div class="box glass"><div class="spinner"></div><p data-i18n="session.reconnecting"></p></div>
            </div>

            <input type="text" id="hidden-keyboard-input" class="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-hidden="true" tabindex="-1">
        </section>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="/js/i18n.js"></script>
    <script src="/js/connection.js"></script>
    <script src="/js/input.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/qr-scanner.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
